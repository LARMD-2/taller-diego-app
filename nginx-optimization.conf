server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # ==========================================
    # OPTIMIZACIONES GLOBALES Y SEGURIDAD
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_min_length 256;

    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    client_header_timeout 3m;
    client_body_timeout 3m;
    send_timeout 3m;
    keepalive_timeout 65;
    keepalive_requests 100;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Preload de rendimiento para tus assets principales
    add_header Link "</styles/css/inventory.css>; rel=preload; as=style" always;

    # ==========================================
    # PROXY INVERSO (El puente hacia la API)
    # ==========================================
    location /api/ {
        # Redirige las peticiones internas de forma transparente
        proxy_pass http://api-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # ENRUTAMIENTO MPA (Soporte para la carpeta /views)
    # ==========================================
    # Entrada principal a la raíz
    location = / {
        try_files /views/index.html =404;
    }

    # Enrutamiento general para páginas y carpetas de scripts/estilos
    location / {
        try_files $uri $uri/ /views$uri /views$uri/ =404;
    }

    # Control de caché para assets estáticos con soporte de rutas /views
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri $uri/ /views$uri /views$uri/ =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Control de caché para archivos HTML con soporte de rutas /views
    location ~* \.(html)$ {
        try_files $uri $uri/ /views$uri /views$uri/ =404;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}